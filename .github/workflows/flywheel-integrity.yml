name: Flywheel Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source registry contract
        run: python tools/test_source_registry.py
      - name: Run read-only doctor
        run: python tools/doctor.py --json
      - name: Rebuild generated frontier
        run: python tools/build_frontier.py
      - name: Require generated projections to be current
        run: git diff --exit-code -- generated/
