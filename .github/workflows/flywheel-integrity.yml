name: Flywheel Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source registry contract
        run: python tools/test_source_registry.py
      - name: Run source inventory contract
        run: python tools/test_source_inventory.py
      - name: Validate compile-input retrieval progress
        run: python tools/check_compile_inputs.py --json
      - name: Run domain machine contract
        run: python tools/test_domain_machines.py
      - name: Run capability truth observation contract
        run: python tools/test_capability_observation.py
      - name: Run ruin guard contract
        run: python tools/test_ruin_guard.py
      - name: Run compact frontier contract
        run: python tools/test_frontier_projection.py
      - name: Run read-only doctor
        run: python tools/doctor.py --json
      - name: Rebuild generated source inventory
        run: python tools/build_source_inventory.py
      - name: Rebuild generated frontier
        run: python tools/build_frontier.py
      - name: Require generated projections to be current
        run: git diff --exit-code -- generated/
